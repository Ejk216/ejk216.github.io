<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Reps</title>
<meta name="description" content="Six logic puzzles a day, the same for everyone. Open this link in Logic Reps.">
<meta property="og:title" content="Logic Reps">
<meta property="og:description" content="Six logic puzzles a day, the same for everyone.">
<meta name="apple-itunes-app" content="app-id=6820641541">
<style>
  :root { --bg: #f2f2f7; --card: #ffffff; --ink: #111114; --quiet: #5b5b66; --link: #0057b8; --wash: #d5e3f5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --card: #1c1c1f; --ink: #f4f4f6; --quiet: #a3a3ad; --link: #6fb0ff; --wash: #17304f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 48px 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 28px 22px; text-align: center; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: var(--quiet); }
  a.button { display: block; text-decoration: none; font-weight: 700; border-radius: 14px; padding: 14px; margin-top: 10px; }
  a.primary { background: var(--link); color: #fff; }
  @media (prefers-color-scheme: dark) { a.primary { color: #06121f; } }
  a.soft { background: var(--wash); color: var(--link); }
  .after { font-size: 14px; margin: 22px 0 0; }
  footer { text-align: center; font-size: 13px; color: var(--quiet); margin-top: 18px; }
  footer a { color: var(--link); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">Logic Reps</h1>
    <p id="line">Six logic puzzles a day, the same for everyone.</p>
    <a class="button primary" id="store" href="https://apps.apple.com/app/id6820641541">Get Logic Reps on the App Store</a>
    <a class="button soft" id="open" href="logicreps://open">I have it: open in Logic Reps</a>
    <p class="after" id="after">New here? Install Logic Reps, then tap the same link again.</p>
  </div>
  <footer>Nothing about this link is sent to this page's server. <a href="https://ejk216.github.io/logic-reps-support/privacy-policy.html">Privacy</a></footer>
</main>
<script>
  // Everything a link says is after the #, which a browser keeps to itself. It is only shown here and handed to the app.
  (function () {
    var said = location.hash.replace(/^#/, "") || location.search.replace(/^\?/, "");
    if (!said) { return; }
    var parts = new URLSearchParams(said);
    var name = (parts.get("name") || "").replace(/[^\p{L}\p{N} .'-]/gu, "").slice(0, 24);
    var games = { "stars": "Stars", "duet": "Duet", "thread": "Thread", "sudoku-six": "Sudoku Six", "plots": "Plots", "ribbons": "Ribbons", "woodcut": "Woodcut" };
    var game = games[parts.get("game") || ""];
    var title = document.getElementById("title"), line = document.getElementById("line"), after = document.getElementById("after");
    if (game) {
      var seconds = parseInt(parts.get("time") || "", 10);
      var time = seconds > 0 && seconds < 36000 ? Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0") : null;
      title.textContent = (name ? name + " sent you a " : "A ") + game + " board" + (name ? "" : " for you");
      line.textContent = time ? "The time to beat is " + time + ". You play the same board." : "You play the same board.";
      after.textContent = "New here? Install Logic Reps, then tap the same link again to play this board.";
    } else if (parts.get("from")) {
      title.textContent = (name || "A friend") + " invited you to Logic Reps";
      line.textContent = "Six logic puzzles a day, the same for everyone. A welcome gift is waiting.";
      after.textContent = "New here? Install Logic Reps, then tap the same link again to get your gift" + (parts.get("f") ? " and add " + (name || "your friend") + " as a friend." : ".");
    }
    document.getElementById("open").href = "logicreps://open#" + said;
  })();
</script>
</body>
</html>
